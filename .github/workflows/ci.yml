name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracking:
    name: Tracking build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'

      - name: Fetch Feishu service metadata
        run: python3 scripts/fetch_meta.py

      - name: Test tracking commands
        run: go test ./cmd/media ./cmd/wechat ./internal/wechatruntime ./shortcuts/workline/... ./shortcuts/imagegen/... -count=1

      - name: Build work-cli
        run: >-
          go build -trimpath
          -ldflags "-s -w -X github.com/larksuite/cli/internal/build.Version=ci"
          -o work-cli .

      - name: Smoke test published command surface
        run: |
          ./work-cli track --help
          ./work-cli track query --help
          ./work-cli track apply --help
          ./work-cli track style-events --help
          ./work-cli media --help
          ./work-cli media resolve --help
          ./work-cli media resolve-batch --help
          ./work-cli media observe --help
          ./work-cli media inquire --help
          ./work-cli image --help
          ./work-cli image generate --help
          ./work-cli image edit --help
          ./work-cli image generate-batch --help
          ./work-cli wechat --help

  packages:
    name: Cross-platform package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'

      - name: Fetch Feishu service metadata
        run: python3 scripts/fetch_meta.py

      - name: Fetch bundled WeChat runtime
        run: bash scripts/fetch-wechat-runtime.sh

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --snapshot --clean --skip=publish

      - name: Verify package names
        run: |
          set -euo pipefail
          test -f dist/work-cli_windows_amd64.zip
          test -f dist/work-cli_linux_amd64.tar.gz
          test -f dist/work-cli_darwin_arm64.tar.gz
          test -f dist/checksums.txt
